trigger: none

pool:
  vmImage: ubuntu-latest

jobs:
- job: Docker
  variables:
    DOCKER_BUILDKIT: 1
    DOCKER_REPOSITORY: zippy-cash-api
  steps:
  - task: Docker@2
    displayName: Login
    inputs:
      command: login
      containerRegistry: $(docker.containerRegistry)
  - task: Docker@2
    displayName: Build Initial
    inputs:
      buildContext: .
      command: build
      repository: $(DOCKER_REPOSITORY)-build
      tags: latest
      arguments: --target build
  - task: Docker@2
    condition: and(succeeded(), eq(variables['docker.push'], 'true'))
    displayName: Build Final and Push
    inputs:
      buildContext: .
      command: buildAndPush
      repository: $(DOCKER_REPOSITORY)
      tags: |
        $(Build.BuildId)
        latest